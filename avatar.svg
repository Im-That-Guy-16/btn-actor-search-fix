<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- faint film-frame perforations, top and bottom -->
  <g fill="#111826">
    <rect x="70"  y="150" width="26" height="20" rx="5"/>
    <rect x="130" y="150" width="26" height="20" rx="5"/>
    <rect x="190" y="150" width="26" height="20" rx="5"/>
    <rect x="70"  y="342" width="26" height="20" rx="5"/>
    <rect x="130" y="342" width="26" height="20" rx="5"/>
    <rect x="190" y="342" width="26" height="20" rx="5"/>
  </g>

  <!-- magnifying glass, neon -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round">
    <circle cx="228" cy="228" r="120" stroke-width="26"/>
    <line x1="318" y1="318" x2="418" y2="418" stroke-width="34"/>
  </g>

  <!-- actor silhouette inside the lens -->
  <g fill="#0b0f14">
    <circle cx="228" cy="228" r="98"/>
  </g>
  <g fill="url(#neon)">
    <circle cx="228" cy="196" r="34"/>
    <path d="M158 300 q70 -78 140 0 q-70 34 -140 0 Z"/>
  </g>
</svg>
